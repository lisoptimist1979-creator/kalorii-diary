<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>Калории — дневник питания</title>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥗</text></svg>">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">К</span> Калории</div>
      <div class="storage-warn" id="storage-warn" hidden>Данные не сохраняются</div>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar" id="tabbar">
      <button class="tab" data-act="nav" data-view="diary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M4 10h16M8 5v14"/></svg>
        <span>Дневник</span>
      </button>
      <button class="tab" data-act="nav" data-view="add">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>Добавить</span>
      </button>
      <button class="tab" data-act="nav" data-view="week">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V9M12 19V4M19 19v-6"/></svg>
        <span>Неделя</span>
      </button>
      <button class="tab" data-act="nav" data-view="profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
        <span>Профиль</span>
      </button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>

    <script src="assets/boot.js?v=e85ad0eb"></script>
</body>
</html>
